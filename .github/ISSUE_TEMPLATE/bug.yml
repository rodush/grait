name: Bug
description: Report a reproducible defect
title: "fix: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give exact steps, environment, and minimal redacted input.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable behavior will prove this fixed?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Suggested regression test and other checks.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link known dependencies or explicitly write None.
    validations:
      required: true

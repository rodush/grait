name: Story
description: Define an outcome for triage and implementation
title: "feat: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What problem should be solved, and for whom?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How should the outcome be verified?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link blockers, related stories, duplicates, and parent issues. Triage records native blocked-by relationships.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and open questions
      description: State limits, decisions needed, or explicitly write None.
    validations:
      required: true

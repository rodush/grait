name: TDD verification
run-name: ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      number: { type: string, required: true }
      digest: { type: string, required: true }
      head: { type: string, required: true }
      baseline: { type: string, required: true }
      pr: { type: string, required: true }
      cycle: { type: string, required: true }
      phase: { type: string, required: true }
      expected: { type: string, required: true }
      operation_id: { type: string, required: true }
permissions:
  contents: read
concurrency:
  group: tdd-verify-${{ inputs.number }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.run_attempt == 1 && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      proof: ${{ steps.proof.outputs.proof }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Authorize exact TDD operation
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          AUTOMATION_LOGIN: ${{ vars.AUTOMATION_LOGIN }}
          AUTOMATION_BUDGET_ISSUE: ${{ vars.AUTOMATION_BUDGET_ISSUE }}
          AUTOMATION_BUDGET_LOGIN: ${{ vars.AUTOMATION_BUDGET_LOGIN }}
        run: node scripts/authorize.mjs
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.baseline }}
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
          path: candidate
      - name: Verify baseline and candidate in isolated containers
        id: proof
        env:
          TDD_BASELINE_PATH: ${{ github.workspace }}/baseline
          TDD_HEAD_PATH: ${{ github.workspace }}/candidate
        run: node trusted/scripts/tdd-verify.mjs
  publish:
    needs: verify
    if: github.run_attempt == 1 && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Bind proof to this run
        env:
          PROOF: ${{ needs.verify.outputs.proof }}
          OPERATION: ${{ inputs.operation_id }}
          HEAD: ${{ inputs.head }}
        run: |
          node -e 'const fs=require("node:fs");const r=JSON.parse(process.env.PROOF);if(r.operation!==process.env.OPERATION||r.head!==process.env.HEAD||r.runId!==process.env.GITHUB_RUN_ID)throw Error("Proof binding mismatch");fs.writeFileSync("proof.json",JSON.stringify(r));'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tdd-proof
          path: proof.json
          retention-days: 7

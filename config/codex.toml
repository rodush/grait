# Reference: https://github.com/rodush/expense-tracker/pull/86
# Canonical project settings; npm run harness:generate installs .codex/config.toml.
# The generated agent limit follows workflow.config.json maxConcurrentWorkers.
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 5
